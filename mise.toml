[tools]
# Languages
bun = "1"
rust = "1"

# Editors / Formatters
shfmt = "latest"
stylua = "latest"
prettier = "latest"
taplo = "latest"

# Frameworks / SDKs
uv = "0"

[settings]
lockfile = true
lockfile_platforms = ["macos-arm64", "linux-x64"]
minimum_release_age = "7d"

[tasks.check-pre-commit]
description = "Run all pre-commit checks with uv"
run = ["uv sync --group dev", "uv run pre-commit run -a"]

[tasks.test-deployment]
description = "Test dotfile links and global command publication in an isolated HOME"
file = "tests/test-deployment.sh"

[tasks.format-check-tools]
hide = true
description = "Check required formatters for the repository"
run = '''
set -eu

missing_tools=""
for tool in stylua shfmt prettier taplo; do
  if ! command -v "$tool" >/dev/null 2>&1; then
    missing_tools="$missing_tools $tool"
  fi
done

if [ -n "$missing_tools" ]; then
  echo "Missing required formatter(s):$missing_tools" >&2
  echo "Install them first, then run: mise run format" >&2
  exit 1
fi
'''

[tasks.format-lua]
hide = true
description = "Format Lua files with Stylua"
run = '''
set -eu

tmpfile="$(mktemp)"
trap 'rm -f "$tmpfile"' EXIT

git ls-files -z -- '*.lua' |
while IFS= read -r -d '' file; do
  if [ -f "$file" ]; then
    printf '%s\0' "$file"
  fi
done > "$tmpfile"
if [ -s "$tmpfile" ]; then
  xargs -0 stylua < "$tmpfile"
fi
'''

[tasks.format-shell]
hide = true
description = "Format shell files with shfmt"
run = '''
set -eu

tmpfile="$(mktemp)"
trap 'rm -f "$tmpfile"' EXIT

git ls-files -z -- '*.sh' '*.bash' '*.zsh' |
while IFS= read -r -d '' file; do
  if [ -f "$file" ]; then
    printf '%s\0' "$file"
  fi
done > "$tmpfile"
if [ -s "$tmpfile" ]; then
  xargs -0 shfmt -w < "$tmpfile"
fi
'''

[tasks.format-prettier]
hide = true
description = "Format JSON, Markdown, and YAML files with Prettier"
run = '''
set -eu

tmpfile="$(mktemp)"
trap 'rm -f "$tmpfile"' EXIT

git ls-files -z -- \
  '*.json' '*.jsonc' '*.md' '*.yaml' '*.yml' \
  ':(exclude)**/lazy-lock.json' \
  ':(exclude)config/ai/apm/apm.lock.yaml' \
  ':(exclude)**/*.lock' |
while IFS= read -r -d '' file; do
  if [ -f "$file" ]; then
    printf '%s\0' "$file"
  fi
done > "$tmpfile"
if [ -s "$tmpfile" ]; then
  xargs -0 prettier --write < "$tmpfile"
fi
'''

[tasks.format-toml]
hide = true
description = "Format TOML files with Taplo"
run = '''
set -eu

tmpfile="$(mktemp)"
trap 'rm -f "$tmpfile"' EXIT

git ls-files -z -- \
  '*.toml' \
  ':(exclude)**/*.lock' |
while IFS= read -r -d '' file; do
  if [ -f "$file" ]; then
    printf '%s\0' "$file"
  fi
done > "$tmpfile"
if [ -s "$tmpfile" ]; then
  xargs -0 taplo fmt < "$tmpfile"
fi
'''

[tasks.format]
description = "Format the repository"
run = [
  { task = "format-check-tools" },
  { tasks = [
    "format-lua",
    "format-shell",
    "format-prettier",
    "format-toml",
  ] },
]

[tasks.link-dotfiles]
hide = true
description = "Link dotfiles-managed files into the home directory"
run = "bash scripts/local/deploy-dotfiles.sh apply"

[tasks.sync-global-commands]
hide = true
description = "Link global CLI commands and remove legacy mise wrappers"
run = "bash scripts/local/sync-global-commands.sh"

[tasks.install-mise-tools]
hide = true
description = "Install tools declared in the local mise configuration"
run = "mise install"

[tasks.install-apm]
hide = true
description = "Install apm-managed AI skills"
run = ["mise -C ~ install apm", "mise -C ~ exec -- apm install -g --frozen"]

[tasks.install]
description = "Run the dotfiles symlink setup and install configured mise tools"
run = [
  { task = "link-dotfiles" },
  { task = "sync-global-commands" },
  { task = "install-mise-tools" },
  { task = "install-apm" },
  { task = "install-bun" },
  { task = "install-pre-commit" },
]

[tasks.install-bun]
description = "Install Bun globals outside the repository"
file = "scripts/local/install-bun.sh"

[tasks.relink]
description = "Relink dotfiles-managed symlinks without overwriting real files"
run = "bash scripts/local/deploy-dotfiles.sh apply"

[tasks.check-deployment]
description = "Check dotfile deployment without changing files"
run = "bash scripts/local/deploy-dotfiles.sh check"

[tasks.diff-deployment]
description = "Show pending dotfile deployment changes"
run = "bash scripts/local/deploy-dotfiles.sh diff"

[tasks.install-pre-commit]
description = "Install the repository pre-commit hook with uv"
file = "scripts/local/install-pre-commit.sh"

[tasks.sync-python]
description = "Sync Python development dependencies with uv"
run = "uv sync --group dev"

[tasks.upgrade]
description = "Upgrade mise-managed tools, Bun globals, and Homebrew packages"
run = [
  { task = "upgrade-mise-tools" },
  { task = "upgrade-apm" },
  { task = "upgrade-nvim-plugins" },
  { task = "upgrade-bun" },
  { task = "upgrade-brew" },
]

[tasks.upgrade-apm]
description = "Update apm-managed AI skills and lock file"
run = ["mise -C ~ install apm", "mise -C ~ exec -- apm update -g --yes"]

[tasks.upgrade-brew]
description = "Upgrade Homebrew packages and sync the tracked Brewfile"
run = [
  "brew upgrade",
  "brew bundle dump --file=config/tools/homebrew/Brewfile --force",
]

[tasks.upgrade-bun]
description = "Update Bun global packages to their latest versions"
run = "bash scripts/local/install-bun.sh upgrade"

[tasks.upgrade-global-tools]
description = "Upgrade global mise tools within their configured version ranges"
run = "mise -C ~ upgrade"

[tasks.upgrade-local-tools]
description = "Upgrade local mise tools within their configured version ranges"
run = "mise upgrade --local"

[tasks.upgrade-mise-tools]
description = "Upgrade local and global mise-managed tools within their configured version ranges"
run = ["mise run upgrade-local-tools", "mise run upgrade-global-tools"]

[tasks.upgrade-nvim-plugins]
description = "Upgrade Neovim plugins managed by lazy.nvim"
run = '''
XDG_CACHE_HOME=/tmp XDG_STATE_HOME=/tmp XDG_CONFIG_HOME="$PWD/config/editors" \
nvim --headless --cmd 'set runtimepath^=config/editors/nvim' -u config/editors/nvim/init.lua "+Lazy! update" +qa
'''
