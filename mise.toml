min_version = "2026.8.4"

[tools]
# Languages
bun = "1"
go = "1"
node = "24"
rust = "1"

# Repository checks
gitleaks = "latest"
lefthook = "2"
prettier = "latest"
shellcheck = "latest"
shfmt = "latest"
stylua = "latest"
taplo = "latest"

[settings]
lockfile = true
lockfile_platforms = ["macos-arm64", "linux-x64"]
minimum_release_age = "7d"

[dotfiles]
"~/.apm" = { source = "dotfiles/ai/apm", mode = "symlink-each", exclude = [
  "apm.lock.yaml",
] }
"~/.apm/apm.lock.yaml" = { source = "dotfiles/ai/apm/apm.lock.yaml", mode = "copy" }
"~/.claude/CLAUDE.md" = "dotfiles/ai/instructions/AGENTS.md"
"~/.claude/settings.json" = "dotfiles/ai/claude/settings.json"
"~/.codex/AGENTS.md" = "dotfiles/ai/instructions/AGENTS.md"
"~/.codex/rules/default.rules" = "dotfiles/ai/codex/rules/default.rules"
"~/.config/ghostty/config.ghostty" = "dotfiles/terminal-apps/ghostty/config.ghostty"
"~/.config/mise/conf.d" = "dotfiles/tools/mise/conf.d"
"~/.config/mise/mise.lock" = "dotfiles/tools/mise/mise.lock"
"~/.config/mise/mise.toml" = "dotfiles/tools/mise/mise.toml"
"~/.config/nvim" = "dotfiles/editors/nvim"
"~/.config/sheldon/plugins.toml" = "dotfiles/shell/sheldon/plugins.toml"
"~/.config/starship" = "dotfiles/shell/starship"
"~/.config/wezterm" = "dotfiles/terminal-apps/wezterm"
"~/.config/worktrunk/config.toml" = "dotfiles/tools/worktrunk/config.toml"
"~/.config/zellij/config.kdl" = "dotfiles/terminal-apps/zellij/config.kdl"
"~/.config/zsh-abbr/user-abbreviations" = "dotfiles/shell/sheldon/abbreviations"
"~/.gitconfig" = "dotfiles/tools/git/.gitconfig"
"~/.local/bin" = { source = "bin", mode = "symlink-each" }
"~/.zlogin" = "dotfiles/shell/terminal/.zlogin"
"~/.zlogout" = "dotfiles/shell/terminal/.zlogout"
"~/.zprofile" = "dotfiles/shell/terminal/.zprofile"
"~/.zshenv" = "dotfiles/shell/terminal/.zshenv"
"~/.zshrc" = "dotfiles/shell/terminal/.zshrc"

[bootstrap.hooks.pre-dotfiles]
run = '''
repo_root="$(git rev-parse --show-toplevel)"
bash "$repo_root/setup/migrations/migrate-to-mise-bootstrap.sh" "$repo_root"
'''

[bootstrap.hooks.post-dotfiles]
run = '''
for config_file in \
  "$HOME/.config/mise/mise.toml" \
  "$HOME/.config/mise/mise.lock" \
  "$HOME/.config/mise/conf.d/"*.toml; do
  [ -f "$config_file" ] || continue
  mise trust "$config_file"
done
'''

[tasks.check]
description = "Run repository checks on all tracked files"
run = "lefthook run check"

[tasks.pre-commit]
hide = true
description = "Run pre-commit checks on staged files"
run = "lefthook run pre-commit"

[tasks.test-deployment]
description = "Test mise bootstrap deployment in isolated home directories"
run = "go test ./tests"

[tasks.check-shell]
description = "Check tracked shell scripts with ShellCheck"
run = '''
set -eu

tmpfile="$(mktemp)"
trap 'rm -f "$tmpfile"' EXIT

git ls-files -z -- '*.sh' '*.bash' 'bin/*' |
while IFS= read -r -d '' file; do
  if [ -f "$file" ]; then
    printf '%s\0' "$file"
  fi
done > "$tmpfile"
if [ -s "$tmpfile" ]; then
  xargs -0 shellcheck < "$tmpfile"
fi
'''

[tasks.format-check-tools]
hide = true
description = "Check required formatters for the repository"
run = '''
set -eu

missing_tools=""
for tool in gofmt stylua shfmt prettier taplo; do
  if ! command -v "$tool" >/dev/null 2>&1; then
    missing_tools="$missing_tools $tool"
  fi
done

if [ -n "$missing_tools" ]; then
  echo "Missing required formatter(s):$missing_tools" >&2
  echo "Install them first, then run: mise run format" >&2
  exit 1
fi
'''

[tasks.format-go]
hide = true
description = "Format Go files with gofmt"
run = '''
set -eu

tmpfile="$(mktemp)"
trap 'rm -f "$tmpfile"' EXIT

git ls-files -z -- '*.go' |
while IFS= read -r -d '' file; do
  if [ -f "$file" ]; then
    printf '%s\0' "$file"
  fi
done > "$tmpfile"
if [ -s "$tmpfile" ]; then
  xargs -0 gofmt -w < "$tmpfile"
fi
'''

[tasks.format-lua]
hide = true
description = "Format Lua files with Stylua"
run = '''
set -eu

tmpfile="$(mktemp)"
trap 'rm -f "$tmpfile"' EXIT

git ls-files -z -- '*.lua' |
while IFS= read -r -d '' file; do
  if [ -f "$file" ]; then
    printf '%s\0' "$file"
  fi
done > "$tmpfile"
if [ -s "$tmpfile" ]; then
  xargs -0 stylua < "$tmpfile"
fi
'''

[tasks.format-shell]
hide = true
description = "Format shell files with shfmt"
run = '''
set -eu

tmpfile="$(mktemp)"
trap 'rm -f "$tmpfile"' EXIT

git ls-files -z -- '*.sh' '*.bash' '*.zsh' 'bin/*' |
while IFS= read -r -d '' file; do
  if [ -f "$file" ]; then
    printf '%s\0' "$file"
  fi
done > "$tmpfile"
if [ -s "$tmpfile" ]; then
  xargs -0 shfmt -w < "$tmpfile"
fi
'''

[tasks.format-prettier]
hide = true
description = "Format JSON, Markdown, and YAML files with Prettier"
run = '''
set -eu

tmpfile="$(mktemp)"
trap 'rm -f "$tmpfile"' EXIT

git ls-files -z -- \
  '*.json' '*.jsonc' '*.md' '*.yaml' '*.yml' \
  ':(exclude)**/lazy-lock.json' \
  ':(exclude)dotfiles/ai/apm/apm.lock.yaml' \
  ':(exclude)**/*.lock' |
while IFS= read -r -d '' file; do
  if [ -f "$file" ]; then
    printf '%s\0' "$file"
  fi
done > "$tmpfile"
if [ -s "$tmpfile" ]; then
  xargs -0 prettier --write < "$tmpfile"
fi
'''

[tasks.format-toml]
hide = true
description = "Format TOML files with Taplo"
run = '''
set -eu

tmpfile="$(mktemp)"
trap 'rm -f "$tmpfile"' EXIT

git ls-files -z -- \
  '*.toml' \
  ':(exclude)**/*.lock' |
while IFS= read -r -d '' file; do
  if [ -f "$file" ]; then
    printf '%s\0' "$file"
  fi
done > "$tmpfile"
if [ -s "$tmpfile" ]; then
  xargs -0 taplo fmt < "$tmpfile"
fi
'''

[tasks.format]
description = "Format the repository"
run = [
  { task = "format-check-tools" },
  { tasks = [
    "format-go",
    "format-lua",
    "format-shell",
    "format-prettier",
    "format-toml",
  ] },
]

[tasks.install-apm]
hide = true
description = "Install apm-managed AI skills"
run = ["mise -C ~ install apm", "mise -C ~ exec -- apm install -g --frozen"]

[tasks.install]
description = "Compatibility entrypoint for the standard machine bootstrap"
run = "mise bootstrap"

[tasks.install-global-tools]
hide = true
description = "Install tools declared in the linked global mise configuration"
run = "mise -C ~ install"

[tasks.bootstrap-common]
hide = true
description = "Finish cross-platform setup not covered by declarative bootstrap steps"
run = [
  { task = "install-global-tools" },
  { task = "install-apm" },
  { task = "install-bun" },
  { task = "install-git-hooks" },
]

[tasks.bootstrap]
hide = true
description = "Finish setup not covered by declarative bootstrap steps"
run = [{ task = "bootstrap-common" }]

[tasks.install-bun]
description = "Install Bun globals outside the repository"
file = "setup/install-bun.sh"

[tasks.install-git-hooks]
description = "Install repository Git hooks with Lefthook"
run = "mise generate git-pre-commit --write --task=pre-commit"

[tasks.upgrade]
description = "Upgrade mise-managed tools, Bun globals, and Homebrew packages"
run = [
  { task = "upgrade-mise-tools" },
  { task = "upgrade-apm" },
  { task = "upgrade-nvim-plugins" },
  { task = "upgrade-bun" },
  { task = "upgrade-brew" },
]

[tasks.upgrade-apm]
description = "Update apm-managed AI skills and lock file"
run = [
  "mise -C ~ install apm",
  "mise -C ~ exec -- apm update -g --yes",
  "mise bootstrap dotfiles add --yes ~/.apm/apm.lock.yaml",
]

[tasks.upgrade-brew]
description = "Upgrade Homebrew packages and sync the tracked Brewfile"
run = [
  "brew upgrade",
  "brew bundle dump --file=setup/homebrew/Brewfile --force",
]

[tasks.upgrade-bun]
description = "Update Bun global packages to their latest versions"
run = "bash setup/install-bun.sh upgrade"

[tasks.upgrade-global-tools]
description = "Upgrade global mise tools within their configured version ranges"
run = "mise -C ~ upgrade"

[tasks.upgrade-local-tools]
description = "Upgrade local mise tools within their configured version ranges"
run = "mise upgrade --local"

[tasks.upgrade-mise-tools]
description = "Upgrade local and global mise-managed tools within their configured version ranges"
run = ["mise run upgrade-local-tools", "mise run upgrade-global-tools"]

[tasks.upgrade-nvim-plugins]
description = "Upgrade Neovim plugins managed by lazy.nvim"
run = '''
XDG_CACHE_HOME=/tmp XDG_STATE_HOME=/tmp XDG_CONFIG_HOME="$PWD/dotfiles/editors" \
nvim --headless --cmd 'set runtimepath^=dotfiles/editors/nvim' -u dotfiles/editors/nvim/init.lua "+Lazy! update" +qa
'''
