min_version = "2026.8.4"

[tools]
# Languages
bun = "1"
go = "1"
node = "24"
rust = "1"

# Repository checks
gitleaks = "latest"
lefthook = "2"
prettier = "latest"
shellcheck = "latest"
shfmt = "latest"
stylua = "latest"
taplo = "latest"

[settings]
lockfile = true
lockfile_platforms = ["macos-arm64", "linux-x64"]
minimum_release_age = "7d"

[dotfiles]
"~/.apm" = { source = "dotfiles/ai/apm", mode = "symlink-each", exclude = [
  "apm.lock.yaml",
] }
"~/.apm/apm.lock.yaml" = { source = "dotfiles/ai/apm/apm.lock.yaml", mode = "copy" }
"~/.claude/CLAUDE.md" = "dotfiles/ai/instructions/AGENTS.md"
"~/.claude/settings.json" = "dotfiles/ai/claude/settings.json"
"~/.codex/AGENTS.md" = "dotfiles/ai/instructions/AGENTS.md"
"~/.codex/rules/default.rules" = "dotfiles/ai/codex/rules/default.rules"
"~/.config/ghostty/config.ghostty" = "dotfiles/terminal-apps/ghostty/config.ghostty"
"~/.config/mise/conf.d" = "dotfiles/tools/mise/conf.d"
"~/.config/mise/mise.lock" = "dotfiles/tools/mise/mise.lock"
"~/.config/mise/mise.toml" = "dotfiles/tools/mise/mise.toml"
"~/.config/nvim" = "dotfiles/editors/nvim"
"~/.config/sheldon/plugins.toml" = "dotfiles/shell/sheldon/plugins.toml"
"~/.config/starship" = "dotfiles/shell/starship"
"~/.config/wezterm" = "dotfiles/terminal-apps/wezterm"
"~/.config/worktrunk/config.toml" = "dotfiles/tools/worktrunk/config.toml"
"~/.config/zellij/config.kdl" = "dotfiles/terminal-apps/zellij/config.kdl"
"~/.config/zsh-abbr/user-abbreviations" = "dotfiles/shell/sheldon/abbreviations"
"~/.gitconfig" = "dotfiles/tools/git/.gitconfig"
"~/.local/bin" = { source = "bin", mode = "symlink-each" }
"~/.zlogin" = "dotfiles/shell/terminal/.zlogin"
"~/.zlogout" = "dotfiles/shell/terminal/.zlogout"
"~/.zprofile" = "dotfiles/shell/terminal/.zprofile"
"~/.zshenv" = "dotfiles/shell/terminal/.zshenv"
"~/.zshrc" = "dotfiles/shell/terminal/.zshrc"

[bootstrap.hooks.pre-dotfiles]
run = '''
repo_root="$(git rev-parse --show-toplevel)"
bash "$repo_root/setup/migrations/migrate-to-mise-bootstrap.sh" "$repo_root"
'''

[bootstrap.hooks.post-dotfiles]
run = '''
for config_file in \
  "$HOME/.config/mise/mise.toml" \
  "$HOME/.config/mise/mise.lock" \
  "$HOME/.config/mise/conf.d/"*.toml; do
  [ -f "$config_file" ] || continue
  mise trust "$config_file"
done
'''
